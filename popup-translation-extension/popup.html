<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Translation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-box">
    <!-- 头部：品牌、当前状态与设置入口 -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">译</span>
        <div class="brand-text">
          <h1 class="brand-name">Popup Translation</h1>
          <div class="brand-sub">
            <span class="badge" id="env-badge">检测中...</span>
            <span class="brand-domain" id="site-hostname"></span>
          </div>
        </div>
      </div>
      <button id="btn-open-options" class="btn-icon" title="打开设置中心" aria-label="打开设置中心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- 当前网站主操作按钮 -->
    <section class="site-card" id="site-card">
      <div id="conn-status-msg" class="conn-alert" style="display: none;"></div>

      <div id="general-immersion-box" class="action-wrap" style="display: none;">
        <button class="primary-btn" id="btn-enable-immersion">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span>开启此网站沉浸式双语翻译</span>
        </button>
      </div>

      <div id="special-action-box" class="action-wrap" style="display: none;">
        <button class="primary-btn" id="btn-site-translate">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span id="btn-site-translate-text">一键翻译全页内容</span>
        </button>
        <div class="sub-row">
          <button id="btn-disable-immersion" class="text-link-btn">退出沉浸式</button>
        </div>
      </div>
    </section>

    <!-- 分组 1：快速控制 -->
    <section class="settings-section">
      <div class="section-heading">快速控制</div>
      <div class="settings-list">
        <div class="setting-row">
          <div class="setting-left">
            <svg class="setting-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/>
            </svg>
            <span class="setting-title">排除此网站生词高亮</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="quick-exclude-check">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-left">
            <svg class="setting-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span class="setting-title">进站自动翻译</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="quick-auto-check">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <div class="section-divider"></div>

    <!-- 分组 2：显示与外观 -->
    <section class="settings-section">
      <div class="section-heading">显示与外观</div>
      <div class="settings-list">
        <div class="setting-row">
          <div class="setting-left">
            <svg class="setting-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span class="setting-title">译文呈现样式</span>
          </div>
          <select id="quick-style-select" class="select-input">
            <option value="replace">中文阅读</option>
            <option value="underline">双语对照</option>
            <option value="card">译文卡片</option>
          </select>
        </div>

        <div class="setting-row">
          <div class="setting-left">
            <svg class="setting-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
            </svg>
            <span class="setting-title">界面视觉皮肤</span>
          </div>
          <select id="quick-theme-select" class="select-input">
            <option value="market_desk">Market Desk</option>
            <option value="animal_island">动森经典</option>
          </select>
        </div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
