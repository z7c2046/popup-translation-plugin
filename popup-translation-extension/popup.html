<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Translation 控制中心</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-box">
    <!-- 头部：品牌与当前域名 -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">译</span>
        <div class="brand-text">
          <h1 class="brand-name">Popup Translation</h1>
          <div class="brand-sub">
            <span class="badge" id="env-badge">检测中...</span>
            <span class="brand-domain" id="site-hostname"></span>
          </div>
        </div>
      </div>
      <button id="btn-open-options" class="btn-icon" title="选项与配置中心">⚙️</button>
    </header>

    <!-- 当前网站操作区 -->
    <section class="card site-card" id="site-card">
      <div id="conn-status-msg" class="conn-alert" style="display: none;"></div>

      <div id="general-immersion-box" class="action-wrap" style="display: none;">
        <button class="primary-btn secondary-style" id="btn-enable-immersion">
          <span>🌐</span>
          <span>开启此网站沉浸式双语翻译</span>
        </button>
      </div>

      <div id="special-action-box" class="action-wrap" style="display: none;">
        <button class="primary-btn" id="btn-site-translate">
          <span>🌐</span>
          <span id="btn-site-translate-text">一键翻译全页内容</span>
        </button>
        <div class="sub-row">
          <button id="btn-disable-immersion" class="text-link-btn">退出沉浸式</button>
        </div>
      </div>
    </section>

    <!-- 偏好开关列表 -->
    <section class="card settings-card">
      <div class="setting-row">
        <div class="setting-left">
          <span class="setting-icon">🚫</span>
          <span class="setting-title">排除此网站生词高亮</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="quick-exclude-check">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div class="setting-left">
          <span class="setting-icon">⚡</span>
          <span class="setting-title">进站自动翻译</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="quick-auto-check">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div class="setting-left">
          <span class="setting-icon">📖</span>
          <span class="setting-title">译文呈现样式</span>
        </div>
        <select id="quick-style-select" class="select-input">
          <option value="replace">中文阅读</option>
          <option value="underline">双语对照</option>
          <option value="card">译文卡片</option>
        </select>
      </div>

      <div class="setting-row">
        <div class="setting-left">
          <span class="setting-icon">🎨</span>
          <span class="setting-title">界面视觉皮肤</span>
        </div>
        <select id="quick-theme-select" class="select-input">
          <option value="market_desk">Market Desk</option>
          <option value="animal_island">动森经典</option>
        </select>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
